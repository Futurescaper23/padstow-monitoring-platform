services:
  - type: web
    name: padstow-estuary-monitoring
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: access-users
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ACCESS_USERS_PATH
        value: /var/data/access-users.json
      - key: WORLDTIDES_API_KEY
        sync: false
